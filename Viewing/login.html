<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to AI Jobmate</title>

    <!--linking Roboto Font from google-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!--linking styleshit-->
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>
        <div class="logo-container">
            AI Jobmate Logo
        </div>
        <div class="ai-jobmate-heading">
            AI Jobmate
        </div>
    </header>
    <main>
        <div class="login-form-container">
            <div class="heading">
                Login User
            </div>
            <div class="user-detail-container">
                <div class="single-detail-container">
                    <div class="text-part">
                        User Email:
                    </div>
                    <input type="text" class="enter-value">
                </div>
                <div class="single-detail-container">
                    <div class="text-part">
                        Password:
                    </div>
                    <input type="text" class="enter-value">
                </div>
            </div>

            <div class="login-button-container">
                <button class="login-button">Login</button>
            </div>

            <div class="forgot-password-container">
                Forgot Password? <a href="" class="forgot-password-link">click here</a>
            </div>

            <div class="direct-registration-container">
                don't have an account? <a href="/register" class="register-page-link">register</a>
            </div>
        </div>
    </main>
</body>
</html>
