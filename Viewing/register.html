<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register to AI Jobmate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Roboto Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./styles/register.css">
</head>

<body>
<div class="page-wrapper">

    <header>
        <div class="logo-container">
            AI Jobmate
        </div>
        <div class="ai-jobmate-heading">
            Intelligent Career Companion
        </div>
    </header>

    <main>
        <div class="register-form-container">

            <div class="heading">
                Create Account
            </div>

            <div class="user-detail-container">

                <!-- Name -->
                <div class="single-detail-container column-layout">
                    <div class="text-part">Full Name</div>
                    <input type="text" class="enter-value js-name" placeholder="Enter your full name">
                </div>

                <!-- Email -->
                <div class="single-detail-container column-layout">
                    <div class="text-part">Email Address</div>
                    <input type="email" class="enter-value js-email" placeholder="Enter your email">
                </div>

                <!-- Password -->
                <div class="single-detail-container column-layout password-wrapper">
                    <div class="text-part">Password</div>

                    <div class="password-input-container">
                        <input type="password" class="enter-value js-password" placeholder="Create password">

                        <span class="show-password-icon-container">
                            <svg class="show-password" viewBox="0 0 24 24" fill="none">
                                <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"
                                      stroke="currentColor" stroke-width="2"/>
                                <circle cx="12" cy="12" r="3"
                                        stroke="currentColor" stroke-width="2"/>
                            </svg>

                            <svg class="hide-password make-invisible" viewBox="0 0 24 24" fill="none">
                                <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"
                                      stroke="currentColor" stroke-width="2"/>
                                <circle cx="12" cy="12" r="3"
                                        stroke="currentColor" stroke-width="2"/>
                                <line x1="3" y1="3" x2="21" y2="21"
                                      stroke="currentColor" stroke-width="2"/>
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="single-detail-container column-layout password-wrapper">
                    <div class="text-part">Confirm Password</div>

                    <div class="password-input-container">
                        <input type="password" class="enter-value js-confirm-password" placeholder="Re-enter password">

                        <span class="show-password-icon-container">
                            <svg class="show-password" viewBox="0 0 24 24" fill="none">
                                <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"
                                      stroke="currentColor" stroke-width="2"/>
                                <circle cx="12" cy="12" r="3"
                                        stroke="currentColor" stroke-width="2"/>
                            </svg>

                            <svg class="hide-password make-invisible" viewBox="0 0 24 24" fill="none">
                                <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"
                                      stroke="currentColor" stroke-width="2"/>
                                <circle cx="12" cy="12" r="3"
                                        stroke="currentColor" stroke-width="2"/>
                                <line x1="3" y1="3" x2="21" y2="21"
                                      stroke="currentColor" stroke-width="2"/>
                            </svg>
                        </span>
                    </div>
                </div>

            </div>

            <div class="error-msg-container"></div>

            <div class="register-button-container">
                <button class="register-button js-register-button">
                    Create Account
                </button>
            </div>

            <div class="direct-login-container">
                Already have an account?
                <a href="/login" class="login-page-link">Login</a>
            </div>

        </div>
    </main>
</div>


<!-- OTP OVERLAY -->
<div class="otp-overlay hidden">
    <div class="otp-modal">
        <div class="otp-heading">Verify Your Email</div>
        <div class="otp-subtext">
            We sent a 6-digit OTP to your email.
        </div>

        <div class="otp-success hidden"></div>

        <input type="text" maxlength="6" class="otp-input" placeholder="Enter OTP">

        <div class="otp-error"></div>

        <button class="verify-otp-btn">Verify OTP</button>

        <div class="resend-otp">Resend OTP</div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="./scripts/register.js" type="module"></script>
</body>
</html>
