<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register to AI Jobmate</title>

    <!--linking Roboto Font from google-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!--linking styleshit-->
    <link rel="stylesheet" href="./styles/register.css">
</head>
<body>
    <header>
        <div class="logo-container">
            AI Jobmate Logo
        </div>
        <div class="ai-jobmate-heading">
            AI Jobmate
        </div>
    </header>
    <main>
        <div class="register-form-container">
            <div class="heading">
                Please fill the form to Register
            </div>
            <div class="user-detail-container">
                <div class="single-detail-container">
                    <div class="text-part">
                        Full Name:
                    </div>
                    <input type="text" class="enter-value js-name">
                </div>
                <div class="single-detail-container">
                    <div class="text-part">
                        Email:
                    </div>
                    <input type="text" class="enter-value js-email">
                </div>
                <div class="single-detail-container">
                    <div class="text-part">
                        Password:
                    </div>
                    <input type="text" class="enter-value js-password">
                </div>
                <div class="single-detail-container">
                    <div class="text-part">
                        Confirm Password:
                    </div>
                    <input type="text" class="enter-value js-confirm-password">
                </div>
            </div>

            <div class="error-msg-container">
                
            </div>

            <div class="register-button-container">
                <button class="register-button js-register-button">Register</button>
            </div>

            <div class="direct-login-container">
                already have an account? <a href="/login" class="login-page-link">login</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./scripts/register.js" type="module"></script>
</body>
</html>
