<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applications</title>

    <script>
      (function () {
        const theme = localStorage.getItem('theme');
        if (theme) {
          document.documentElement.setAttribute('data-theme', theme);
        }
      })();
    </script>

    <!--linking roboto font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!--linking stylesheet-->
    <link rel="stylesheet" href="/styles/applications.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/sidebar.css">
</head>
<body>
    <header class="header">
        <!--fetching from components folder-->
    </header>
    <aside class="sidebar">
        <!--fetching from components folder-->
    </aside>
    <main>
        <div class="main-header">
            <div class="title">
                Applications
                <div class="subtitle">
                    Track, manage & review all submissions
                </div>
            </div>
            <button class="add-application-button"><span class="plus-sign">+</span>New Application</button>
        </div>
        <div class="filters-row">
            <!-- Search -->
            <div class="filter search-filter">
                <input
                    type="text"
                    placeholder="Search by jobTitle or company name"
                    class="search-input"
                />
                <i data-lucide="search" class="search-icon"></i>
            </div>
            <!-- Status -->
            <div class="filter">
                <select class="filter-select select-status">
                    <option value="all">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="Approved">Approved</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>
            <!-- Date -->
            <div class="filter">
                <select class="filter-select select-date">
                    <option value="all">All Dates</option>
                    <option value="today">Today</option>
                    <option value="7days">Last 7 days</option>
                    <option value="30days">Last 30 days</option>
                </select>
            </div>
            <!-- Sort -->
            <div class="filter push-right">
                <select class="filter-select select-sort">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                </select>
            </div>
        </div>

        <section class="jobs-section">
            <!--job cards will be shown here-->
        </section>
    </main> 

    <div class="drawer-overlay" id="drawerOverlay"></div>
    
    <aside class="drawer" id="applicationDrawer">
        <div class="drawer-header">
            <h2 class="drawer-title">New Application</h2>
            <button class="close-drawer">&times;</button>
        </div>

        <div class="drawer-form">
            <label>
                Job Title
                <input type="text" placeholder="Frontend Developer" class="job-title-input"/>
            </label>

            <label>
                Company
                <input type="text" placeholder="Google" class="company-name-input"/>
            </label>

            <label>
                Status
                <select class="status-value">
                    <option>Pending</option>
                    <option>Approved</option>
                    <option>Rejected</option>
                </select>
            </label>

            <label>
                Applied Date
                <input type="date" class="applied-date"/>
            </label>

            <label>
                Note(optional)
                <input type="text" class="note"/>
            </label>

            <div class="err-msg-section">
                <!--error message occurs here while adding new application-->
            </div>

            <button class="submit-btn">
                Save Application
            </button>
        </div>
    </aside>

    <!-- Note Modal Overlay -->
    <div class="note-modal-overlay hidden" id="noteModalOverlay">
        <div class="note-modal">
            <h3>Add / Edit Note</h3>

            <textarea
                id="noteModalInput"
                placeholder="Write your note here..."
                rows="5"
            ></textarea>

            <div class="note-modal-actions">
                <button class="btn secondary" id="cancelNoteBtn">Cancel</button>
                <button class="btn primary" id="saveNoteBtn">Save Note</button>
            </div>
        </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/scripts/utils/logout.js"></script>
    <script src="/scripts/applications.js"></script>
</body>
