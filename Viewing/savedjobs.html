<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Jobs</title>

    <!--linking roboto font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!--linking stylesheet-->
    <link rel="stylesheet" href="/styles/savedjobs.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/sidebar.css">
</head>
<body>
    <header class="header">
        <!--fetching from components folder-->
    </header>
    <aside class="sidebar">
        <!--fetching from components folder-->
    </aside>
    <main>
        <div class="main-header">
            <div class="page-title">
                Jobs Saved
                <div class="page-subtitle">jobs you bookmarked to apply later</div>
            </div>
            <div class="saved-jobs-add-count-container">
                <div class="jobs-saved-count">
                    (<span class="count-value">3</span>)
                </div>
                <button class="add-new-saved-job-button"><span class="plus-sign">+</span>Add</button>
            </div>
        </div>

        <div class="filters-row">
            <!-- Search -->
            <div class="filter search-filter">
                <input
                    type="text"
                    placeholder="Search by name, ID or email"
                    class="search-input"
                />
                <i data-lucide="search" class="search-icon"></i>
            </div>
            <!-- Date -->
            <div class="filter">
                <select class="filter-select">
                    <option value="all">All Dates</option>
                    <option value="today">Today</option>
                    <option value="7days">Last 7 days</option>
                    <option value="30days">Last 30 days</option>
                </select>
            </div>
            <!-- Sort -->
            <div class="filter push-right">
                <select class="filter-select">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="status">By status</option>
                </select>
            </div>
        </div>

        <div class="saved-jobs-list">
            
        </div>
    </main>

    <div class="drawer-overlay" id="drawerOverlay"></div>
    
    <aside class="drawer" id="applicationDrawer">
        <div class="drawer-header">
            <h2>New Saved Job</h2>
            <button class="close-drawer">&times;</button>
        </div>

        <form class="drawer-form">
            <label>
                Job Title
                <input type="text" placeholder="Frontend Developer" class="job-title-input"/>
            </label>

            <label>
                Company
                <input type="text" placeholder="Google" class="company-input"/>
            </label>

            <label>
                Role
                <input type="text" placeholder="React developer" class="role-input"/>
            </label>

            <label>
                Date
                <input type="date" class="date-input"/>
            </label>

            <button class="submit-btn">
                Save Job
            </button>
        </form>
    </aside>


    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/scripts/savedjobs.js" type="module"></script>
</body>
</html>
