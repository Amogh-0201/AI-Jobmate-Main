<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Profile</title>

        <!--linking roboto font-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <!--linking stylesheet-->
        <link rel="stylesheet" href="/styles/profile.css">
        <link rel="stylesheet" href="/styles/header.css">
        <link rel="stylesheet" href="/styles/sidebar.css">
    </head>
    <body>
        <header class="header">
            <!--fetching from components folder-->
        </header>
        <aside class="sidebar">
            <!--fetching from components folder-->
        </aside>
        <main class="profile-page">
            <h1 class="page-title">Profile</h1>
            <p class="page-subtitle">Manage your personal and career information</p>

            <!-- BASIC INFO -->
            <section class="profile-card">
                <h2 class="section-title">Basic Information</h2>

                <div class="info-grid">
                    <div class="info-item">
                        <label>Name</label>
                        <p>Amogh Das Barman</p>
                    </div>

                    <div class="info-item">
                        <label>Email</label>
                        <p>
                            amogh@email.com
                            <span class="verified-badge">Verified</span>
                        </p>
                    </div>

                    <div class="info-item">
                        <label>Joined</label>
                        <p>January 2026</p>
                    </div>
                </div>
            </section>

            <!-- CAREER FOCUS -->
            <section class="profile-card">
                <div class="card-header">
                    <h2 class="section-title">Career Focus</h2>
                    <button class="edit-btn">Edit</button>
                </div>

                <div class="info-grid">
                    <div class="info-item">
                        <label>Target Role</label>
                        <p>Frontend Developer</p>
                    </div>

                    <div class="info-item">
                        <label>Experience Level</label>
                        <p>Fresher</p>
                    </div>
                </div>
            </section>

            <!-- RESUME -->
            <section class="profile-card">
                <h2 class="section-title">Resume</h2>

                <div class="resume-box">
                    <div class="resume-info">
                        <p class="resume-name">resume_v3.pdf</p>
                        <span class="resume-status">Last updated 5 days ago</span>
                    </div>

                    <button class="resume-btn">Replace Resume</button>
                </div>
            </section>
        </main>




        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="/scripts/utils/logout.js"></script>
        <script src="/scripts/profile.js"></script>
    </body>
</html>
