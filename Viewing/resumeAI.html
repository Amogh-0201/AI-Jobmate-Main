<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume AI</title>

    <script>
      (function () {
        const theme = localStorage.getItem('theme');
        if (theme) {
          document.documentElement.setAttribute('data-theme', theme);
        }
      })();
    </script>

    <!--linking roboto font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!--linking Inter font-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!--linking stylesheet-->
    <link rel="stylesheet" href="/styles/resumeAI.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/sidebar.css">
</head>
<body>
    <header class="header">
        <!--fetching from components folder-->
    </header>
    <aside class="sidebar">
        <!--fetching from components folder-->
    </aside>

    <main>
        <div class="container">
            <!-- Header -->
            <h1>Resume AI</h1>
            <p class="subtitle">
                Enter the job you’re applying for and see how your resume aligns.
            </p>
            <!-- Job Input -->
            <div class="card">
                <label>Job You Are Applying For</label>
                <input type="text" class="job-role-input" placeholder="e.g. Python Developer, Data Scientist" />
            </div>
            <!-- Resume Input -->
            <div class="card">
                <label>Upload Resume (PDF)</label>
                <div class="upload-box">
                    <p class="upload-text">Drag & drop your resume here</p>
                    <input type="file" id="resume-pdf-input" accept=".pdf" />

                    <div class="uploaded-file hide">
                        <span class="file-name"></span>
                        <button class="remove-pdf-btn" type="button">✕</button>
                    </div>
                </div>

                <div class="resume-text-header">
                    <label>OR Paste Resume Text ( if you paste resume text the pdf you uploaded will be ignored. )</label>
                    <button class="clear-text-btn" type="button">Clear</button>
                </div>

                <textarea class="resume-text-input" placeholder="Paste your resume here..."></textarea>


                <button class="btn analyze-resume-btn">Analyze Resume</button>
            </div>

            <!-- AI Result -->
            <div class="card result-card hide-card">
                <!--ai suggested job result will appear here-->
            </div>

            <!-- Skill Gap Analysis Section -->
            <div class="card skill-gap-card hide-card">
                <!--skill gaps analysis will appear here-->
            </div>
        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/scripts/resumeAI.js" type="module"></script>
</body>
</html>
