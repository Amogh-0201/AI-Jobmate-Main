<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!--linking roboto font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!--linking stylesheet-->
    <link rel="stylesheet" href="/styles/dashboard.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/sidebar.css">
</head>
<body>
    <header class="header">
        <!--fetching from components folder-->
    </header>
    <aside class="sidebar">
        <!--fetching from components folder-->
    </aside>

    <main>
        <section class="quick-stats-container">
            <p class="quick-stats-heading">Quick stats</p>
            <div class="quick-stats">
                <div class="stat-card">
                    <p class="stat-title">Applications Sent</p>
                    <h2 class="stat-value no-of-job-applications"></h2>
                </div>
                <div class="stat-card">
                    <p class="stat-title">Pending</p>
                    <h2 class="stat-value no-of-pendings"></h2>
                </div>
                <div class="stat-card">
                    <p class="stat-title">Offers</p>
                    <h2 class="stat-value no-of-offers"></h2>
                </div>
                <div class="stat-card">
                    <p class="stat-title">Saved Jobs</p>
                    <h2 class="stat-value no-of-saved-jobs"></h2>
                </div>
            </div>
        </section>

        <section class="recent-activity">
            <h3 class="section-title">Recent Activity</h3>

            <ul class="activity-list">
                <!--recent activities will appear here-->
            </ul>
        </section>


        <section class="ai-suggestions">
            <h3 class="section-title">Suggestions</h3>

            <div class="suggestion-list">
                <!--suggestions will appear here-->
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/scripts/utils/logout.js"></script>
    <script src="/scripts/dashboard.js"></script>
</body>
</html>
